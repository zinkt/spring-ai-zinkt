upstream backend_up {
    server backend:8080;   # Java 服务
}

upstream frontend_up {
    server frontend:80;    # Vue 前端
}

upstream golang_up {
    server golang:8080;    # Go 服务（gink）
}

server {
    listen 80;
    server_name zinkt.top;

    # =============================
    # 1. Java 后端：/service/api/
    # =============================
    location /service/api/ {
        proxy_pass http://backend_up/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # =============================
    # 2. Vue 前端：/service/
    # =============================
    location /service/ {
        proxy_pass http://frontend_up/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 前端 history 路由支持（可选，Vue 如果用 history 模式需要）
        try_files $uri $uri/ /index.html;
    }

    # =============================
    # 3. Golang 服务：根路径及其他
    # =============================
    location / {
        proxy_pass http://golang_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
